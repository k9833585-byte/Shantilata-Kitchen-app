name: Build Shantilata Kitchen APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          mkdir android-project
          unzip ShantilataKitchen_Android_Project_v2.zip -d android-project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p android-project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Shantilata-Kitchen-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
